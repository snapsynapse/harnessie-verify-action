name: "Harnessie Verify"
description: >-
  Verify a PR's claims, not its word: sandboxed checks plus an independent
  verifier model; fail-closed exit codes gate merges.
author: "Sam Rogers (Snap Synapse)"
branding:
  icon: "check-circle"
  color: "green"

inputs:
  criteria:
    description: >-
      Path to a claims file, or "auto" to derive claims from the PR body
      (boilerplate stripped, provenance-stamped; auto is convenience, not
      authority). Mutually exclusive with evidence-bundle.
    required: false
    default: "auto"
  evidence-bundle:
    description: >-
      Path to a Harnessie v1 evidence bundle. Selecting it bypasses criteria:
      auto; a non-auto criteria value is rejected as ambiguous.
    required: false
    default: ""
  evidence-root:
    description: >-
      Directory containing files referenced by evidence-bundle. Required in
      bundle mode; paths must remain content-addressed beneath this root.
    required: false
    default: ""
  checks:
    description: >-
      Deterministic check commands, one per line. Each runs sandboxed in the
      workspace; exit 0 is the only accepted pass.
    required: false
    default: ""
  models:
    description: >-
      Path to a Harnessie models.yaml in the repo. Mutually exclusive with
      models-endpoint.
    required: false
    default: ""
  models-endpoint:
    description: >-
      OpenAI-compatible Chat Completions base URL for the verifier model (e.g.
      a self-hosted endpoint). Used when models is not set. Current OpenAI
      Responses models require a models.yaml. API keys arrive only through
      HARNESSIE_MODEL_API_KEY.
    required: false
    default: ""
  models-model:
    description: "Model id at models-endpoint (required with models-endpoint)."
    required: false
    default: ""
  allow-network:
    description: >-
      Let check commands use the network (checks are network-denied by
      default; the verifier agent stays denied regardless).
    required: false
    default: "false"
  stage-diff:
    description: >-
      Stage the PR diff into the workspace as PR.diff so change-surface
      claims are checkable. Requires actions/checkout with fetch-depth: 0.
    required: false
    default: "true"
  fail-on-cannot-verify:
    description: >-
      Map exit 2 (cannot verify: no sandbox backend, provider error, missing
      config) to a failing job. Fail-closed is the default and the
      recommendation; set false for advisory mode.
    required: false
    default: "true"
  report-artifact:
    description: "Upload report.md and proofs as a workflow artifact."
    required: false
    default: "true"
  harnessie-version:
    description: "harnessie version to install (the action pins its tested default)."
    required: false
    default: "1.4.1"
  max-steps:
    description: "Verifier agent step ceiling."
    required: false
    default: "20"

outputs:
  verdict:
    description: "VERIFIED, FAILED, or CANNOT_VERIFY"
    value: ${{ steps.verify.outputs.verdict }}
  exit-code:
    description: "Raw harnessie verify exit code (0/1/2)"
    value: ${{ steps.verify.outputs.exit_code }}
  report-path:
    description: "Path to the generated report.md"
    value: ${{ steps.verify.outputs.report_path }}

runs:
  using: "composite"
  steps:
    - name: Refuse unsafe trigger
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/scripts/refuse-unsafe-trigger.sh"

    - name: Install harnessie
      shell: bash
      env:
        INPUT_HARNESSIE_VERSION: ${{ inputs.harnessie-version }}
      run: |
        python3 -m pip install --quiet "harnessie==$INPUT_HARNESSIE_VERSION"
        harnessie --help >/dev/null

    - name: Ensure sandbox backend (best effort)
      shell: bash
      run: |
        # Harness checks run only inside an OS sandbox and fail closed without
        # one (exit 2). Linux backend order: bubblewrap, firejail, docker.
        # Ubuntu 24.04 runners ship AppArmor restrictions on unprivileged user
        # namespaces, which makes bwrap fail its usability probe even when
        # installed; relaxing it on the ephemeral runner VM is the documented
        # trade for a working sandbox. Every step here is non-fatal: with no
        # admitted backend the harness fails closed, never unsandboxed.
        if [ "$(uname -s)" = "Linux" ]; then
          command -v bwrap >/dev/null || sudo apt-get install -y -q bubblewrap 2>/dev/null || true
          if command -v bwrap >/dev/null && \
             ! bwrap --ro-bind / / --unshare-net --die-with-parent true 2>/dev/null; then
            sudo sysctl -qw kernel.apparmor_restrict_unprivileged_userns=0 2>/dev/null || true
            sudo sysctl -qw kernel.unprivileged_userns_clone=1 2>/dev/null || true
          fi
        fi
        BACKEND=$(python3 -c "from harness.sandbox import backend_name; print(backend_name())")
        echo "harness sandbox backend: $BACKEND"
        if [ "$BACKEND" = "None" ]; then
          echo "::warning::no OS sandbox backend admitted on this runner; deterministic checks will be blocked and the run will report cannot-verify (fail closed)."
        fi

    - name: Stage PR diff
      if: ${{ inputs.stage-diff == 'true' && inputs.evidence-bundle == '' && github.event_name == 'pull_request' }}
      shell: bash
      run: |
        BASE_SHA="${{ github.event.pull_request.base.sha }}"
        if git cat-file -e "$BASE_SHA" 2>/dev/null; then
          MB=$(git merge-base "$BASE_SHA" HEAD 2>/dev/null || echo "$BASE_SHA")
          git diff "$MB" HEAD > PR.diff
          echo "staged PR.diff ($(wc -l < PR.diff) lines)"
        else
          echo "::warning::base sha not available (shallow checkout?); PR.diff not staged. Use actions/checkout with fetch-depth: 0 to enable change-surface claims."
        fi

    - name: Resolve claims source
      id: criteria
      shell: bash
      env:
        INPUT_CRITERIA: ${{ inputs.criteria }}
        INPUT_EVIDENCE_BUNDLE: ${{ inputs.evidence-bundle }}
        INPUT_EVIDENCE_ROOT: ${{ inputs.evidence-root }}
      run: |
        if [ -n "$INPUT_EVIDENCE_BUNDLE" ]; then
          if [ "$INPUT_CRITERIA" != "auto" ]; then
            echo "::error::criteria and evidence-bundle are mutually exclusive"
            exit 1
          fi
          if [ ! -f "$INPUT_EVIDENCE_BUNDLE" ]; then
            echo "::error::evidence bundle not found: $INPUT_EVIDENCE_BUNDLE"
            exit 1
          fi
          if [ -z "$INPUT_EVIDENCE_ROOT" ]; then
            echo "::error::evidence-root is required with evidence-bundle"
            exit 1
          fi
          if [ ! -d "$INPUT_EVIDENCE_ROOT" ]; then
            echo "::error::evidence root is not a directory: $INPUT_EVIDENCE_ROOT"
            exit 1
          fi
          if ! harnessie verify --help | grep -Fq -- "--evidence-bundle"; then
            echo "::error::the selected harnessie-version does not support evidence bundles; use 1.2.0 or newer"
            exit 1
          fi
          echo "kind=evidence-bundle" >> "$GITHUB_OUTPUT"
          echo "path=$INPUT_EVIDENCE_BUNDLE" >> "$GITHUB_OUTPUT"
          echo "evidence_root=$INPUT_EVIDENCE_ROOT" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if [ "$INPUT_CRITERIA" != "auto" ]; then
          if [ ! -f "$INPUT_CRITERIA" ]; then
            echo "::error::criteria file not found: $INPUT_CRITERIA"
            exit 1
          fi
          echo "kind=criteria" >> "$GITHUB_OUTPUT"
          echo "path=$INPUT_CRITERIA" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        # Auto mode: PR body verbatim minus HTML comments, provenance-stamped.
        # Deliberately dumb: no model touches claim extraction, because an
        # action that authors the claims it grades is self-dealing.
        python3 - "$GITHUB_EVENT_PATH" <<'PYEOF'
        import json, re, sys
        event = json.load(open(sys.argv[1]))
        body = (event.get("pull_request") or {}).get("body") or ""
        body = re.sub(r"<!--.*?-->", "", body, flags=re.S).strip()
        if not body:
            print("::error::criteria: auto found an empty PR body; supply a claims file instead")
            raise SystemExit(1)
        with open("harnessie-claims.md", "w", encoding="utf-8") as f:
            f.write("# Claims (auto-derived verbatim from the PR body; "
                    "no extraction intelligence applied)\n\n")
            f.write("Treat every assertion below as a claim to test against "
                    "the workspace artifacts.\n\n---\n\n")
            f.write(body + "\n")
        PYEOF
        echo "kind=criteria" >> "$GITHUB_OUTPUT"
        echo "path=harnessie-claims.md" >> "$GITHUB_OUTPUT"

    - name: Resolve models config
      id: models
      shell: bash
      env:
        INPUT_MODELS: ${{ inputs.models }}
        INPUT_MODELS_ENDPOINT: ${{ inputs.models-endpoint }}
        INPUT_MODELS_MODEL: ${{ inputs.models-model }}
      run: |
        if [ -n "$INPUT_MODELS" ]; then
          echo "path=$INPUT_MODELS" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if [ -z "$INPUT_MODELS_ENDPOINT" ] || [ -z "$INPUT_MODELS_MODEL" ]; then
          echo "::error::provide either models (a models.yaml path) or both models-endpoint and models-model"
          exit 1
        fi
        python3 - "$INPUT_MODELS_ENDPOINT" "$INPUT_MODELS_MODEL" <<'PYEOF'
        import json
        import sys

        config = {"tiers": {"mid": {
            "provider": "openai-compat",
            "model_id": sys.argv[2],
            "base_url": sys.argv[1],
            "api_key_env": "HARNESSIE_MODEL_API_KEY",
            "max_tokens": 8192,
            "supports_effort": False,
        }}}
        with open("harnessie-models.yaml", "w", encoding="utf-8") as stream:
            json.dump(config, stream)
            stream.write("\n")
        PYEOF
        echo "path=harnessie-models.yaml" >> "$GITHUB_OUTPUT"

    - name: Verify
      id: verify
      shell: bash
      env:
        INPUT_ALLOW_NETWORK: ${{ inputs.allow-network }}
        INPUT_CHECKS: ${{ inputs.checks }}
        INPUT_FAIL_ON_CANNOT_VERIFY: ${{ inputs.fail-on-cannot-verify }}
        INPUT_MAX_STEPS: ${{ inputs.max-steps }}
        INPUT_REPORT_ARTIFACT: ${{ inputs.report-artifact }}
        CLAIMS_KIND: ${{ steps.criteria.outputs.kind }}
        CLAIMS_PATH: ${{ steps.criteria.outputs.path }}
        EVIDENCE_ROOT: ${{ steps.criteria.outputs.evidence_root }}
        MODELS_PATH: ${{ steps.models.outputs.path }}
      run: |
        ARGS=(--workspace . --models "$MODELS_PATH"
              --report-dir "$RUNNER_TEMP/harnessie-verify-report"
              --max-steps "$INPUT_MAX_STEPS")
        if [ "$CLAIMS_KIND" = "evidence-bundle" ]; then
          ARGS+=(--evidence-bundle "$CLAIMS_PATH"
                 --evidence-root "$EVIDENCE_ROOT")
        else
          ARGS+=(--criteria "$CLAIMS_PATH")
        fi
        [ "$INPUT_ALLOW_NETWORK" = "true" ] && ARGS+=(--allow-network)
        while IFS= read -r line; do
          [ -n "$line" ] && ARGS+=(--check "$line")
        done <<< "$INPUT_CHECKS"
        set +e
        harnessie verify "${ARGS[@]}"
        CODE=$?
        set -e
        case "$CODE" in
          0) VERDICT=VERIFIED ;;
          1) VERDICT=FAILED ;;
          *) VERDICT=CANNOT_VERIFY ;;
        esac
        echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
        echo "verdict=$VERDICT" >> "$GITHUB_OUTPUT"
        REPORT="$RUNNER_TEMP/harnessie-verify-report/report.md"
        echo "report_path=$REPORT" >> "$GITHUB_OUTPUT"
        if [ -f "$REPORT" ]; then
          {
            echo "## Harnessie verify: $VERDICT"
            echo
            echo "- Exit code: $CODE"
            if [ "$INPUT_REPORT_ARTIFACT" = "true" ]; then
              echo "- Full claim report and proofs: harnessie-verify-report artifact"
            else
              echo "- Full claim report upload: disabled by report-artifact input"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
        else
          echo "## Harnessie verify: $VERDICT (no report produced)" >> "$GITHUB_STEP_SUMMARY"
        fi
        if [ "$CODE" = "2" ] && [ "$INPUT_FAIL_ON_CANNOT_VERIFY" != "true" ]; then
          echo "::warning::verification could not run to a verdict (exit 2); advisory mode passed the job. Nothing was verified."
          exit 0
        fi
        exit "$CODE"

    - name: Upload report artifact
      if: ${{ always() && inputs.report-artifact == 'true' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: harnessie-verify-report
        path: ${{ runner.temp }}/harnessie-verify-report/
        if-no-files-found: ignore
