name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The offline matrix proves the action's wiring and exit-code mapping with
  # zero network model calls. A real VERIFIED (exit 0) run needs a live
  # verifier endpoint; that is the documented dogfood step, not CI.
  failing-check-fails-job:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: verify
        continue-on-error: true
        uses: ./
        with:
          criteria: fixture/claims.md
          checks: "false"
          models: fixture/models-mock.yaml
          report-artifact: "false"
      - name: Assert FAILED
        run: |
          test "${{ steps.verify.outcome }}" = "failure"
          test "${{ steps.verify.outputs.verdict }}" = "FAILED"
          test "${{ steps.verify.outputs.exit-code }}" = "1"

  cannot-verify-fails-closed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: verify
        continue-on-error: true
        uses: ./
        with:
          criteria: fixture/claims.md
          checks: "grep -q hello fixture/workspace/out.txt"
          models: fixture/models-mock.yaml
          report-artifact: "false"
      - name: Assert CANNOT_VERIFY failed the job (fail-closed default)
        run: |
          test "${{ steps.verify.outcome }}" = "failure"
          test "${{ steps.verify.outputs.verdict }}" = "CANNOT_VERIFY"
          test "${{ steps.verify.outputs.exit-code }}" = "2"

  cannot-verify-advisory-passes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: verify
        uses: ./
        with:
          criteria: fixture/claims.md
          checks: "grep -q hello fixture/workspace/out.txt"
          models: fixture/models-mock.yaml
          fail-on-cannot-verify: "false"
          report-artifact: "false"
      - name: Assert advisory mode passed with CANNOT_VERIFY
        run: |
          test "${{ steps.verify.outputs.verdict }}" = "CANNOT_VERIFY"

  evidence-bundle-reaches-verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Build an exact-revision evidence bundle outside the workspace
        run: >-
          python3 scripts/make-evidence-fixture.py
          --bundle "$RUNNER_TEMP/evidence.yaml"
          --evidence-root "$RUNNER_TEMP/evidence-root"
          --revision "$(git rev-parse HEAD)"
      - id: verify
        continue-on-error: true
        uses: ./
        with:
          evidence-bundle: ${{ runner.temp }}/evidence.yaml
          evidence-root: ${{ runner.temp }}/evidence-root
          checks: "grep -q hello fixture/workspace/out.txt"
          models: fixture/models-mock.yaml
          report-artifact: "false"
      - name: Assert evidence preflight passed before the mock provider halted
        run: |
          test "${{ steps.verify.outcome }}" = "failure"
          test "${{ steps.verify.outputs.verdict }}" = "CANNOT_VERIFY"
          test "${{ steps.verify.outputs.exit-code }}" = "2"
          test -f "${{ steps.verify.outputs.report-path }}"
          grep -Fq "evidence_bundle_sha256" "${{ steps.verify.outputs.report-path }}"

  evidence-bundle-fresh-check-still-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Build an exact-revision evidence bundle outside the workspace
        run: >-
          python3 scripts/make-evidence-fixture.py
          --bundle "$RUNNER_TEMP/evidence.yaml"
          --evidence-root "$RUNNER_TEMP/evidence-root"
          --revision "$(git rev-parse HEAD)"
      - id: verify
        continue-on-error: true
        uses: ./
        with:
          evidence-bundle: ${{ runner.temp }}/evidence.yaml
          evidence-root: ${{ runner.temp }}/evidence-root
          checks: "false"
          models: fixture/models-mock.yaml
          report-artifact: "false"
      - name: Assert fresh checks remain authoritative
        run: |
          test "${{ steps.verify.outcome }}" = "failure"
          test "${{ steps.verify.outputs.verdict }}" = "FAILED"
          test "${{ steps.verify.outputs.exit-code }}" = "1"
          test -f "${{ steps.verify.outputs.report-path }}"
          grep -Fq "evidence_bundle_sha256" "${{ steps.verify.outputs.report-path }}"

  stale-evidence-bundle-refuses-before-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Build a stale-revision evidence bundle outside the workspace
        run: >-
          python3 scripts/make-evidence-fixture.py
          --bundle "$RUNNER_TEMP/evidence.yaml"
          --evidence-root "$RUNNER_TEMP/evidence-root"
          --revision "0000000000000000000000000000000000000000"
      - id: verify
        continue-on-error: true
        uses: ./
        with:
          evidence-bundle: ${{ runner.temp }}/evidence.yaml
          evidence-root: ${{ runner.temp }}/evidence-root
          checks: "false"
          models: fixture/models-mock.yaml
          report-artifact: "false"
      - name: Assert stale preflight refused before the failing check ran
        run: |
          test "${{ steps.verify.outcome }}" = "failure"
          test "${{ steps.verify.outputs.verdict }}" = "CANNOT_VERIFY"
          test "${{ steps.verify.outputs.exit-code }}" = "2"
          test ! -e "${{ steps.verify.outputs.report-path }}"

  refuses-pull-request-target:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Assert pull_request_target is refused
        run: |
          set +e
          OUTPUT=$(bash scripts/refuse-unsafe-trigger.sh pull_request_target 2>&1)
          CODE=$?
          set -e
          printf '%s\n' "$OUTPUT"
          test "$CODE" = "1"
          grep -Fq "must run on pull_request, never pull_request_target" <<< "$OUTPUT"
      - name: Assert pull_request is admitted
        run: bash scripts/refuse-unsafe-trigger.sh pull_request
